# Keep TIP-2 API warm during morning hours.
#
# Plain UTC cron only (no timezone: field). ping.sh always curls when invoked.
#
# IST = UTC+5:30
#   08:30 IST = 03:00 UTC

name: TIP API keep-warm

on:
  schedule:
    # 08:30 IST (03:00 UTC), Mon–Fri
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          chmod +x scripts/ping.sh
          bash scripts/ping.sh
